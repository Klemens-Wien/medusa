<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Massagepistolen, Gua Sha, Aromaöle, Yoga und Schlaf-Essentials. Gratisversand ab 49 €.">
<title>Vermont | Wellness & Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root {
  --bg: #0b0812;
  --bg-2: #14101e;
  --surface: rgba(255, 255, 255, 0.055);
  --surface-2: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.11);
  --border-strong: rgba(255, 255, 255, 0.22);
  --text: #f7f3ff;
  --muted: rgba(247, 243, 255, 0.62);
  --faint: rgba(247, 243, 255, 0.4);
  --neon: #d6ff3f;
  --neon-ink: #131505;
  --pink: #ff5fd2;
  --violet: #9d7bff;
  --peach: #ffb38a;
  --mint: #6ff2cf;
  --star: #ffd25e;
  --danger: #ff6b8b;
  --cream: #f6efe6;
  --cream-ink: #1b1424;
  --radius: 24px;
  --radius-sm: 16px;
  --gutter: 16px;
  --header-h: 58px;
  --tabbar-h: 64px;
  --sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: -20vh -20vw;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(40vmax 40vmax at 8% 8%, rgba(157, 123, 255, 0.22), transparent 60%),
    radial-gradient(36vmax 36vmax at 92% 22%, rgba(255, 95, 210, 0.15), transparent 60%),
    radial-gradient(40vmax 40vmax at 50% 98%, rgba(111, 242, 207, 0.1), transparent 60%);
}
body.locked { overflow: hidden; }
img, svg, video { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--neon); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -0.035em; line-height: 1.04; font-weight: 800; }
p { margin: 0; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
.container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }
.section { padding: 52px 0; }
.section-sm { padding: 32px 0; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--neon); }
.title-xl { font-size: clamp(34px, 9.5vw, 64px); margin-top: 10px; }
.title-lg { font-size: clamp(28px, 7.5vw, 46px); margin-top: 8px; }
.gradient-text { background: linear-gradient(100deg, var(--peach), var(--pink) 45%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
.link-more { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--muted); white-space: nowrap; }
.link-more:hover { color: var(--text); }
.glass { background: rgba(24, 18, 36, 0.58); border: 1px solid var(--border); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); }
.art { position: relative; overflow: hidden; background: #241a38; }
.art > svg, .art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 1px solid transparent; font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; transition: transform 0.25s var(--ease), box-shadow 0.3s var(--ease), background 0.25s, opacity 0.2s; white-space: nowrap; }
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; pointer-events: none; }
.btn-neon { background: var(--neon); color: var(--neon-ink); box-shadow: 0 10px 40px -10px rgba(214, 255, 63, 0.75); }
.btn-neon:hover { box-shadow: 0 0 0 5px rgba(214, 255, 63, 0.16), 0 14px 50px -10px rgba(214, 255, 63, 0.95); }
.btn-glass { background: rgba(255, 255, 255, 0.09); border-color: var(--border-strong); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.btn-glass:hover { background: rgba(255, 255, 255, 0.15); }
.btn-dark { background: var(--cream-ink); color: var(--cream); }
.btn-block { width: 100%; }
.btn-sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.icon-btn { position: relative; display: grid; place-items: center; width: 44px; height: 44px; flex: none; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); transition: transform 0.2s var(--ease), background 0.2s; }
.icon-btn:active { transform: scale(0.9); }
.icon-btn:hover { background: var(--surface-2); }
.count-badge { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--pink); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 14px rgba(255, 95, 210, 0.85); }
.count-badge[hidden] { display: none; }
.bump { animation: bump 0.5s var(--spring); }
@keyframes bump { 40% { transform: scale(1.45); } }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 10px var(--neon); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ---------- Announcement ---------- */
.announce { position: relative; z-index: 45; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 38px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; text-align: center; color: var(--neon-ink); background: linear-gradient(90deg, var(--neon), #9ff0d4 50%, var(--neon)); background-size: 200% 100%; animation: shimmer 8s linear infinite; }
.announce b { font-weight: 800; }
.announce .timer { font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 999px; background: rgba(19, 21, 5, 0.12); white-space: nowrap; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* ---------- Header ---------- */
.header { position: sticky; top: 8px; z-index: 40; margin: 8px 8px 0; height: var(--header-h); border-radius: 999px; display: flex; align-items: center; gap: 6px; padding: 0 7px 0 7px; max-width: 1220px; transition: background 0.3s, box-shadow 0.3s; }
@media (min-width: 1236px) { .header { margin: 8px auto 0; } }
.header.scrolled { box-shadow: 0 18px 40px -24px rgba(0, 0, 0, 0.8); }
.logo { font-size: 23px; font-weight: 800; letter-spacing: -0.055em; padding: 0 6px; }
.logo span { color: var(--neon); text-shadow: 0 0 18px rgba(214, 255, 63, 0.8); }
.header .logo { margin-right: auto; }
.header-nav { display: none; gap: 4px; margin-right: auto; }
.header-nav a { padding: 8px 14px; border-radius: 999px; font-weight: 700; font-size: 14.5px; color: var(--muted); transition: background 0.2s, color 0.2s; }
.header-nav a:hover, .header-nav a[aria-current="page"] { color: var(--text); background: var(--surface); }
.desk-only { display: none !important; }

/* ---------- Bottom tab bar ---------- */
.tabbar { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 38; height: var(--tabbar-h); border-radius: 26px; display: grid; grid-template-columns: repeat(5, 1fr); padding: 0 6px; transition: transform 0.45s var(--ease); }
.tabbar.hide { transform: translateY(150%); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--faint); transition: color 0.2s; }
.tab svg { transition: transform 0.3s var(--spring); }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] svg { transform: translateY(-1px) scale(1.08); color: var(--neon); }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 8px var(--neon); }
.tab .count-badge { top: 6px; right: calc(50% - 22px); }
main { padding-bottom: calc(var(--tabbar-h) + 30px); }

/* ---------- Hero ---------- */
.hero { position: relative; min-height: calc(100svh - 38px); margin-top: calc(-1 * (var(--header-h) + 8px)); display: flex; align-items: flex-end; overflow: hidden; border-radius: 0 0 38px 38px; isolation: isolate; }
.hero-mesh { position: absolute; inset: 0; z-index: -3; background: #160f24; overflow: hidden; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.85; animation: float 16s ease-in-out infinite alternate; }
.blob.b1 { width: 70vmax; height: 70vmax; left: -25vmax; top: -20vmax; background: #6d3bd8; }
.blob.b2 { width: 55vmax; height: 55vmax; right: -22vmax; top: 10vh; background: #ff4fb8; animation-duration: 19s; }
.blob.b3 { width: 50vmax; height: 50vmax; left: 10vw; bottom: -28vmax; background: #ff9a6b; animation-duration: 22s; opacity: 0.6; }
@keyframes float { to { transform: translate3d(6vw, 4vh, 0) scale(1.08); } }
.hero-video { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1.2s var(--ease); mix-blend-mode: luminosity; }
.hero-video.is-playing { opacity: 0.42; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(11, 8, 18, 0.15) 0%, rgba(11, 8, 18, 0) 35%, rgba(11, 8, 18, 0.7) 75%, var(--bg) 100%); }
.hero-floats { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.float-card { position: absolute; width: 34vw; max-width: 210px; aspect-ratio: 4 / 5; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.25); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6); animation: bob 7s ease-in-out infinite; will-change: transform; }
.float-card > svg { width: 100%; height: 100%; }
.float-card.f1 { right: 5vw; top: calc(var(--header-h) + 34px); width: 42vw; transform: rotate(7deg); }
.float-card.f2 { display: none; }
.float-card.f3 { left: 7vw; top: calc(var(--header-h) + 70px); width: 28vw; animation-delay: -3.5s; transform: rotate(-9deg); opacity: 0.8; }
@keyframes bob { 50% { translate: 0 -14px; } }
.hero-content { padding-top: calc(var(--header-h) + 52vw + 40px); padding-bottom: 36px; }
.hero-title { font-size: clamp(42px, 12.6vw, 96px); letter-spacing: -0.055em; line-height: 0.93; margin: 16px 0 16px; }
.hero-title .serif { font-size: 1.08em; letter-spacing: -0.02em; }
.hero-sub { font-size: 17px; color: rgba(247, 243, 255, 0.82); max-width: 460px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.hero-proof { display: flex; align-items: center; gap: 12px; margin-top: 24px; font-size: 14px; color: var(--muted); }
.avatars { display: flex; }
.avatars span { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--bg); margin-left: -8px; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--neon-ink); }
.avatars span:first-child { margin-left: 0; }

/* ---------- Stories ---------- */
.stories { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; padding: 22px var(--gutter) 6px; margin: 0 auto; max-width: 1240px; }
.stories::-webkit-scrollbar { display: none; }
.story-bubble { flex: none; display: grid; justify-items: center; gap: 7px; width: 76px; font-size: 12px; font-weight: 700; color: var(--muted); }
.story-ring { width: 72px; height: 72px; border-radius: 50%; padding: 3px; background: conic-gradient(from 200deg, var(--neon), var(--mint), var(--violet), var(--pink), var(--peach), var(--neon)); transition: transform 0.3s var(--spring); }
.story-bubble.seen .story-ring { background: var(--border-strong); }
.story-bubble:active .story-ring { transform: scale(0.92); }
.story-ring .art { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--bg); }

/* ---------- Marquee ---------- */
.marquee { overflow: hidden; border-block: 1px solid var(--border); background: linear-gradient(90deg, rgba(157, 123, 255, 0.12), rgba(255, 95, 210, 0.12)); padding: 13px 0; margin-top: 22px; }
.marquee-track { display: flex; width: max-content; gap: 38px; animation: marquee 30s linear infinite; font-weight: 800; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.marquee-track span::after { content: "\2726"; margin-left: 38px; color: var(--neon); }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ---------- Category bento ---------- */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bento-tile { position: relative; display: flex; flex-direction: column; justify-content: flex-end; min-height: 170px; padding: 16px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); isolation: isolate; transition: transform 0.4s var(--ease); }
.bento-tile:active { transform: scale(0.98); }
.bento-tile .art { position: absolute; inset: 0; z-index: -2; }
.bento-tile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 40%, rgba(11, 8, 18, 0.8)); }
.bento-tile h3 { font-size: 20px; }
.bento-tile span { font-size: 13px; color: var(--muted); font-weight: 600; }
.bento-tile.wide { grid-column: span 2; min-height: 200px; }
.bento-tile .go { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
@media (hover: hover) { .bento-tile:hover { transform: translateY(-3px); } .bento-tile:hover .art svg { transform: scale(1.05); } }
.bento-tile .art svg { transition: transform 0.8s var(--ease); }

/* ---------- Rails & grid ---------- */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: 62%; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 calc(var(--gutter) * -1); padding: 4px var(--gutter) 10px; scroll-padding: 0 var(--gutter); }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* ---------- Product card ---------- */
.card { position: relative; display: flex; flex-direction: column; height: 100%; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); overflow: hidden; transition: transform 0.45s var(--ease), border-color 0.3s, box-shadow 0.45s; }
.card-link { display: flex; flex-direction: column; flex: 1; }
.card-media { aspect-ratio: 4 / 5; }
.card-media .alt { opacity: 0; transition: opacity 0.5s var(--ease); }
@media (hover: hover) {
  .card:hover { transform: translateY(-5px); border-color: rgba(255, 95, 210, 0.45); box-shadow: 0 24px 50px -22px rgba(255, 95, 210, 0.55); }
  .card:hover .card-media .alt { opacity: 1; }
}
.card:active { transform: scale(0.985); }
.badge { position: absolute; top: 10px; left: 10px; z-index: 2; padding: 5px 10px; border-radius: 999px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(11, 8, 18, 0.55); border: 1px solid rgba(214, 255, 63, 0.55); color: var(--neon); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.badge.sale { border-color: rgba(255, 95, 210, 0.6); color: #ffd0f1; }
.heart-btn { position: absolute; top: 8px; right: 8px; z-index: 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: rgba(11, 8, 18, 0.45); border: 1px solid rgba(255, 255, 255, 0.18); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: transform 0.3s var(--spring); }
.heart-btn:active { transform: scale(0.8); }
.heart-btn[aria-pressed="true"] { color: var(--pink); }
.heart-btn[aria-pressed="true"] svg { fill: var(--pink); filter: drop-shadow(0 0 6px rgba(255, 95, 210, 0.9)); }
.heart-btn.pop svg { animation: heartpop 0.5s var(--spring); }
@keyframes heartpop { 30% { transform: scale(1.5); } }
.quick-btn { position: absolute; right: 8px; bottom: 8px; z-index: 2; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--neon); color: var(--neon-ink); box-shadow: 0 8px 24px -6px rgba(214, 255, 63, 0.8); transition: transform 0.3s var(--spring); }
.quick-btn:active { transform: scale(0.85); }
.card-body { display: flex; flex-direction: column; gap: 5px; padding: 12px 12px 14px; flex: 1; }
.card-title { font-size: 14.5px; font-weight: 750; line-height: 1.25; letter-spacing: -0.015em; }
.card-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--muted); }
.swatch-dots { display: flex; gap: 4px; }
.swatch-dots i { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.35); }
.price-row { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; margin-top: auto; padding-top: 4px; }
.price { font-weight: 800; font-size: 16.5px; letter-spacing: -0.02em; }
.price-old { font-size: 12.5px; color: var(--muted); text-decoration: line-through; }
.price-save { font-size: 11.5px; font-weight: 800; color: var(--pink); }

/* ---------- Stars ---------- */
.stars { position: relative; display: inline-block; line-height: 0; flex: none; }
.stars-fill { position: absolute; inset: 0 auto 0 0; overflow: hidden; white-space: nowrap; color: var(--star); filter: drop-shadow(0 0 4px rgba(255, 210, 94, 0.55)); }
.stars-base { color: rgba(255, 255, 255, 0.18); white-space: nowrap; }
.stars svg { display: inline-block; }

/* ---------- Spotlight ---------- */
.spotlight { position: relative; display: grid; gap: 22px; border-radius: 32px; padding: 14px 14px 22px; overflow: hidden; isolation: isolate; }
.spotlight::before { content: ""; position: absolute; width: 340px; height: 340px; right: -100px; top: -100px; border-radius: 50%; background: var(--pink); filter: blur(100px); opacity: 0.4; z-index: -1; }
.spotlight-media { aspect-ratio: 1; border-radius: 24px; }
.spotlight-body { padding: 0 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 22px; }
.stat { padding: 12px 10px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); text-align: center; }
.stat b { display: block; font-size: 24px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); font-weight: 600; }

/* ---------- Cream sections (bundle, quiz) ---------- */
.cream { background: var(--cream); color: var(--cream-ink); border-radius: 32px; padding: 26px 18px; position: relative; overflow: hidden; }
.cream .muted { color: rgba(27, 20, 36, 0.62); }
.cream .eyebrow { color: #7a4fe0; }
.cream .price-old { color: rgba(27, 20, 36, 0.5); }
.bundle-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0 16px; position: relative; }
.bundle-item { display: grid; gap: 6px; font-size: 12px; font-weight: 700; line-height: 1.25; }
.bundle-item .art { aspect-ratio: 1; border-radius: 18px; }
.bundle-plus { position: absolute; top: calc(33.3% - 6px); width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--cream-ink); color: var(--cream); display: grid; place-items: center; font-weight: 800; z-index: 1; font-size: 14px; }
.bundle-total { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
.bundle-total .price { font-size: 28px; }
.quiz-card { background: linear-gradient(135deg, #1f1533, #3a1c4a); border: 1px solid var(--border); border-radius: 32px; padding: 26px 20px; position: relative; overflow: hidden; isolation: isolate; }
.quiz-card .orb { position: absolute; width: 220px; height: 220px; right: -60px; bottom: -70px; border-radius: 50%; background: conic-gradient(from 0deg, var(--neon), var(--mint), var(--violet), var(--pink), var(--neon)); filter: blur(30px); opacity: 0.6; z-index: -1; animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Reviews ---------- */
.review-card { scroll-snap-align: start; border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 9px; background: var(--surface); border: 1px solid var(--border); height: 100%; }
.review-card h4 { font-size: 16.5px; letter-spacing: -0.015em; line-height: 1.25; }
.review-card p { color: rgba(247, 243, 255, 0.8); font-size: 14.5px; }
.review-meta { display: flex; align-items: center; gap: 10px; margin-top: auto; padding-top: 6px; font-size: 12.5px; color: var(--muted); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--neon-ink); background: linear-gradient(135deg, var(--neon), var(--mint)); flex: none; }
.verified { color: var(--mint); font-weight: 700; }
.review-product { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); font-size: 12.5px; font-weight: 700; }
.review-product .art { width: 38px; height: 46px; border-radius: 10px; flex: none; }
.helpful { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); align-self: flex-start; }
.helpful[aria-pressed="true"] { color: var(--neon); border-color: rgba(214, 255, 63, 0.5); }
.rating-big { display: flex; align-items: center; gap: 12px; }
.rating-big strong { font-size: 46px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
.rating-bars { display: grid; gap: 4px; margin: 16px 0 6px; font-size: 13px; }
.rating-bar { display: grid; grid-template-columns: 38px 1fr 26px; align-items: center; gap: 10px; color: var(--muted); padding: 4px 6px; border-radius: 10px; text-align: left; width: 100%; }
.rating-bar[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.rating-bar-track { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.rating-bar-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--star), var(--peach)); }
.review-list { display: grid; gap: 12px; margin-top: 16px; }
.mine { border-color: rgba(214, 255, 63, 0.4); }

/* ---------- Insta grid ---------- */
.insta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; border-radius: 22px; overflow: hidden; }
.insta a { position: relative; aspect-ratio: 1; }
.insta .art { position: absolute; inset: 0; }
.insta .likes { position: absolute; left: 8px; bottom: 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 800; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }

/* ---------- USP / FAQ / Newsletter / Footer ---------- */
.usp-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.usp { padding: 18px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); }
.usp-icon { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; margin-bottom: 12px; background: linear-gradient(135deg, rgba(157, 123, 255, 0.45), rgba(255, 95, 210, 0.35)); }
.usp h3 { font-size: 15.5px; letter-spacing: -0.015em; line-height: 1.25; }
.usp p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.accordion details { border-bottom: 1px solid var(--border); }
.accordion details:first-child { border-top: 1px solid var(--border); }
.accordion summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 17px 0; font-weight: 750; cursor: pointer; }
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::after { content: "+"; flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: var(--neon); background: var(--surface); transition: transform 0.35s var(--ease); }
.accordion details[open] summary::after { transform: rotate(45deg); }
.accordion .acc-body { padding: 0 0 18px; color: var(--muted); font-size: 15px; }
.cream .accordion details { border-color: rgba(27, 20, 36, 0.12); }
.newsletter { position: relative; padding: 32px 20px; border-radius: 32px; overflow: hidden; text-align: center; background: radial-gradient(circle at 0% 0%, rgba(255, 95, 210, 0.55), transparent 55%), radial-gradient(circle at 100% 100%, rgba(157, 123, 255, 0.6), transparent 55%), #1a1228; border: 1px solid var(--border); }
.newsletter-form { display: flex; gap: 6px; margin: 20px auto 0; padding: 6px; border-radius: 999px; max-width: 460px; }
.newsletter-form input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; padding: 0 12px; outline: none; }
.newsletter-form .btn { min-height: 46px; padding: 0 18px; }
.code-reveal { display: inline-flex; align-items: center; gap: 10px; margin-top: 20px; padding: 10px 10px 10px 18px; border-radius: 999px; border: 1px dashed var(--neon); font-weight: 800; letter-spacing: 0.08em; }
.footer { padding: 30px 0 20px; color: var(--muted); font-size: 14px; }
.footer-grid { display: grid; gap: 24px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 26px; }
.footer h4 { color: var(--text); margin: 0 0 10px; font-size: 14px; letter-spacing: 0; }
.footer ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
.footer a:hover { color: var(--text); }
.pay-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; }
.pay-row span { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 11.5px; font-weight: 800; color: var(--text); background: var(--surface); }

/* ---------- Shop page ---------- */
.page-top { padding-top: 26px; }
.toolbar { position: sticky; top: calc(var(--header-h) + 14px); z-index: 20; margin: 18px calc(var(--gutter) * -1) 16px; padding: 10px var(--gutter); background: linear-gradient(180deg, var(--bg) 70%, transparent); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13.5px; transition: all 0.25s var(--ease); }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .n { font-size: 11px; opacity: 0.6; }
.toolbar-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.select { position: relative; flex: 1; }
.select select { width: 100%; appearance: none; -webkit-appearance: none; min-height: 40px; padding: 0 36px 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13.5px; }
.select select option { background: var(--bg-2); }
.select::after { content: ""; position: absolute; right: 15px; top: 50%; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-70%) rotate(45deg); pointer-events: none; opacity: 0.7; }
.toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13.5px; white-space: nowrap; }
.toggle[aria-pressed="true"] { border-color: var(--pink); color: #ffd0f1; background: rgba(255, 95, 210, 0.12); }
.result-count { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.empty { text-align: center; padding: 50px 16px; display: grid; justify-items: center; gap: 14px; color: var(--muted); }
.empty-icon { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); color: var(--text); }

/* ---------- PDP ---------- */
.back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); padding: 18px 0 14px; }
.pdp-layout { display: grid; gap: 22px; }
.gallery { position: relative; margin: 0 calc(var(--gutter) * -1); }
.gallery-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 10px; padding: 0 var(--gutter); }
.gallery-track::-webkit-scrollbar { display: none; }
.gallery-slide { flex: 0 0 100%; aspect-ratio: 4 / 5; scroll-snap-align: center; border-radius: 28px; cursor: zoom-in; }
.gallery-hint { position: absolute; right: calc(var(--gutter) + 12px); top: 12px; z-index: 2; pointer-events: none; font-size: 12px; padding: 6px 12px; }
.gallery-heart { position: absolute; left: calc(var(--gutter) + 12px); top: 12px; z-index: 2; }
.thumbs { display: flex; gap: 8px; justify-content: center; margin-top: 12px; padding: 0 var(--gutter); }
.thumbs button { width: 56px; height: 68px; border-radius: 14px; overflow: hidden; border: 2px solid transparent; opacity: 0.55; transition: all 0.25s var(--ease); }
.thumbs button[aria-current="true"] { border-color: var(--neon); opacity: 1; }
.thumbs .art { width: 100%; height: 100%; }
.pdp-title { font-size: clamp(32px, 9vw, 54px); margin: 8px 0 6px; }
.pdp-sub { color: var(--muted); font-size: 16px; }
.pdp-rating { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--muted); font-weight: 600; }
.pdp-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; margin: 16px 0 4px; }
.pdp-price .price { font-size: 32px; }
.klarna { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
.klarna b { color: var(--text); }
.opt-label { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 10px; }
.opt-label b { color: var(--text); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.swatch { width: 46px; height: 46px; border-radius: 50%; padding: 4px; border: 2px solid var(--border); transition: all 0.25s var(--spring); }
.swatch i { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 -6px 12px rgba(0, 0, 0, 0.25), inset 0 4px 8px rgba(255, 255, 255, 0.3); }
.swatch[aria-checked="true"] { border-color: var(--neon); transform: scale(1.06); box-shadow: 0 0 18px rgba(214, 255, 63, 0.35); }
.buy-row { display: flex; gap: 10px; }
.qty { display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--border-strong); flex: none; }
.qty button { width: 40px; height: 50px; font-size: 20px; display: grid; place-items: center; }
.qty span { min-width: 22px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.qty.sm button { width: 32px; height: 34px; font-size: 17px; }
.qty.sm span { font-size: 14px; }
.buy-row .btn-neon { flex: 1; }
.delivery { display: grid; gap: 10px; margin: 18px 0; padding: 14px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; }
.delivery .row svg { color: var(--mint); flex: none; }
.in-stock { color: var(--mint); font-weight: 700; }
.benefits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.benefit { padding: 12px 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); text-align: center; font-size: 12px; font-weight: 700; line-height: 1.3; display: grid; gap: 6px; justify-items: center; }
.benefit svg { color: var(--neon); }
.fbt { display: grid; gap: 8px; margin-top: 14px; }
.fbt-item { display: grid; grid-template-columns: auto 52px 1fr auto; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); font-size: 14px; font-weight: 700; }
.fbt-item .art { width: 52px; height: 62px; border-radius: 12px; }
.check { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--border-strong); display: grid; place-items: center; transition: all 0.2s; }
.check[aria-checked="true"] { background: var(--neon); border-color: var(--neon); color: var(--neon-ink); }
.check svg { opacity: 0; }
.check[aria-checked="true"] svg { opacity: 1; }
.sticky-buy { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 37; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 26px; transform: translateY(160%); transition: transform 0.45s var(--ease); }
.sticky-buy.show { transform: none; }
.sticky-buy .art { width: 44px; height: 52px; border-radius: 12px; flex: none; }
.sticky-buy .info { min-width: 0; flex: 1; }
.sticky-buy .info b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sticky-buy .info span { font-size: 15px; font-weight: 800; }
.sticky-buy .btn { min-height: 48px; padding: 0 18px; }

/* ---------- Overlays: drawer / sheet / modal ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(5, 3, 10, 0.55); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.35s var(--ease); }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 61; width: min(430px, 94vw); display: flex; flex-direction: column; border-radius: 30px 0 0 30px; border-right: 0; background: rgba(20, 14, 32, 0.9); transform: translateX(105%); transition: transform 0.5s var(--ease); }
.drawer.open { transform: none; }
.drawer.left { right: auto; left: 0; border-radius: 0 30px 30px 0; transform: translateX(-105%); border-left: 0; border-right: 1px solid var(--border); }
.drawer.left.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 16px 12px 22px; }
.drawer-head h2 { font-size: 26px; }
.drawer-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px 16px; }
.drawer-foot { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); display: grid; gap: 10px; background: rgba(11, 8, 18, 0.4); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; max-height: 90svh; display: flex; flex-direction: column; border-radius: 30px 30px 0 0; border-bottom: 0; background: rgba(20, 14, 32, 0.94); transform: translateY(105%); transition: transform 0.5s var(--ease); }
.sheet.open { transform: none; }
.sheet::before { content: ""; width: 42px; height: 5px; border-radius: 99px; background: var(--border-strong); margin: 10px auto 0; flex: none; }
@media (min-width: 760px) { .sheet { left: 50%; right: auto; width: 560px; bottom: 50%; border-radius: 30px; border-bottom: 1px solid var(--border); transform: translate(-50%, 60%) scale(0.96); opacity: 0; transition: transform 0.45s var(--ease), opacity 0.3s; } .sheet.open { transform: translate(-50%, 50%); opacity: 1; } .sheet::before { display: none; } }
.fullscreen { position: fixed; inset: 0; z-index: 61; display: flex; flex-direction: column; background: var(--bg); opacity: 0; transform: scale(1.02); transition: opacity 0.3s var(--ease), transform 0.4s var(--ease); }
.fullscreen.open { opacity: 1; transform: none; }

/* cart */
.ship-progress { margin: 0 6px 12px; font-size: 13px; color: var(--muted); }
.progress-track { height: 7px; margin-top: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--mint), var(--neon)); box-shadow: 0 0 12px var(--neon); transition: width 0.7s var(--ease); }
.line { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 10px; animation: slidein 0.45s var(--ease); }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } }
.line .art { width: 74px; height: 88px; border-radius: 14px; }
.line-title { font-weight: 750; font-size: 14.5px; line-height: 1.25; }
.line-sub { font-size: 12.5px; color: var(--muted); }
.line-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 8px; }
.line-remove { color: var(--faint); padding: 6px; border-radius: 8px; }
.line-remove:hover { color: var(--danger); }
.upsell { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; padding: 10px; border-radius: 18px; border: 1px dashed var(--border-strong); margin-top: 6px; font-size: 13.5px; font-weight: 700; }
.upsell .art { width: 50px; height: 60px; border-radius: 12px; }
.code-form { display: flex; gap: 6px; }
.input { width: 100%; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.04); font-size: 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(157, 123, 255, 0.2); }
.input.invalid { border-color: var(--danger); }
textarea.input { padding: 12px 16px; min-height: 110px; resize: vertical; }
.code-form .input { min-height: 44px; border-radius: 999px; text-transform: uppercase; }
.code-msg { font-size: 12.5px; min-height: 0; }
.code-msg.ok { color: var(--mint); }
.code-msg.err { color: var(--danger); }
.totals { display: grid; gap: 6px; font-size: 14px; }
.totals .row { justify-content: space-between; }
.totals .grand { font-size: 19px; font-weight: 800; color: var(--text); margin-top: 4px; }
.discount { color: var(--mint); }

/* search */
.search-bar { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) var(--gutter) 12px; }
.search-input { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border-strong); }
.search-input input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; }
.search-body { flex: 1; overflow-y: auto; padding: 8px var(--gutter) 40px; }
.result { display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 8px; border-radius: 18px; transition: background 0.2s; }
.result:hover, .result:focus-visible { background: var(--surface); }
.result .art { width: 56px; height: 68px; border-radius: 14px; }
.result mark { background: none; color: var(--neon); }

/* menu */
.menu-links { display: grid; gap: 2px; margin-top: 10px; }
.menu-links a, .menu-links button { display: flex; align-items: center; justify-content: space-between; padding: 14px 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.04em; border-bottom: 1px solid var(--border); text-align: left; width: 100%; }
.menu-cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 18px; }
.menu-cats a { position: relative; height: 90px; border-radius: 18px; overflow: hidden; display: flex; align-items: flex-end; padding: 10px; font-weight: 800; font-size: 14px; isolation: isolate; }
.menu-cats .art { position: absolute; inset: 0; z-index: -1; }
.menu-cats a::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 30%, rgba(11, 8, 18, 0.75)); }

/* story viewer */
.story { position: fixed; inset: 0; z-index: 70; background: #000; display: flex; justify-content: center; opacity: 0; transition: opacity 0.3s; }
.story.open { opacity: 1; }
.story-frame { position: relative; width: 100%; max-width: 480px; height: 100%; overflow: hidden; }
.story-frame .art { position: absolute; inset: 0; }
.story-frame .art svg { animation: kenburns 6s linear forwards; }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12); } }
.story-frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.5) 0%, transparent 25%, transparent 50%, rgba(0, 0, 0, 0.75) 100%); pointer-events: none; }
.story-bars { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 3; display: flex; gap: 4px; }
.story-bars i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.3); overflow: hidden; }
.story-bars i b { display: block; height: 100%; width: 0; background: #fff; }
.story-head { position: absolute; top: calc(22px + env(safe-area-inset-top)); left: 12px; right: 8px; z-index: 3; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
.story-head .mini { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 2px solid #fff; }
.story-head .mini .art { position: relative; width: 100%; height: 100%; }
.story-head .icon-btn { margin-left: auto; background: rgba(0, 0, 0, 0.3); border-color: rgba(255, 255, 255, 0.25); }
.story-text { position: absolute; left: 20px; right: 20px; bottom: calc(30px + env(safe-area-inset-bottom)); z-index: 3; display: grid; gap: 12px; }
.story-text h3 { font-size: 34px; }
.story-text p { font-size: 16px; color: rgba(255, 255, 255, 0.85); }
.story-tap { position: absolute; top: 80px; bottom: 170px; z-index: 2; width: 50%; }
.story-tap.prev { left: 0; }
.story-tap.next { right: 0; }

/* quiz */
.quiz-body { flex: 1; overflow-y: auto; padding: 8px var(--gutter) 40px; display: flex; flex-direction: column; max-width: 640px; width: 100%; margin: 0 auto; }
.quiz-progress { display: flex; gap: 6px; margin: 4px 0 26px; }
.quiz-progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--surface-2); }
.quiz-progress i.on { background: var(--neon); box-shadow: 0 0 10px var(--neon); }
.quiz-q { font-size: clamp(30px, 8vw, 44px); margin-bottom: 22px; }
.quiz-options { display: grid; gap: 10px; }
.quiz-option { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border); font-weight: 750; font-size: 16px; text-align: left; transition: all 0.25s var(--ease); animation: rise 0.5s var(--ease) both; }
.quiz-option:nth-child(2) { animation-delay: 0.06s; } .quiz-option:nth-child(3) { animation-delay: 0.12s; } .quiz-option:nth-child(4) { animation-delay: 0.18s; }
.quiz-option:hover { border-color: var(--border-strong); background: var(--surface-2); }
.quiz-option:active { transform: scale(0.98); }
.quiz-option .emoji-dot { width: 42px; height: 42px; border-radius: 14px; flex: none; display: grid; place-items: center; background: linear-gradient(135deg, rgba(157, 123, 255, 0.45), rgba(255, 95, 210, 0.35)); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

/* lightbox */
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(5, 3, 10, 0.96); overflow: hidden; touch-action: none; opacity: 0; transition: opacity 0.3s; }
.lightbox.open { opacity: 1; }
.lightbox-stage { position: absolute; inset: 0; cursor: zoom-in; }
.lightbox-stage.zoomed { cursor: grab; }
.lightbox-stage .art { position: absolute; inset: 0; background: none; transition: transform 0.4s var(--ease); will-change: transform; }
.lightbox-stage .art svg { object-fit: contain; }
.lightbox-stage.dragging .art { transition: none; }
.lightbox-close { position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 2; }
.lightbox-tip { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap; }

/* forms / checkout */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 700; color: var(--muted); }
.field .err { font-size: 12px; color: var(--danger); min-height: 0; }
.form-grid { display: grid; gap: 12px; }
.form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-3 { display: grid; grid-template-columns: 110px 1fr; gap: 12px; }
.steps { display: flex; align-items: center; gap: 8px; margin: 6px 0 22px; font-size: 13px; font-weight: 700; color: var(--faint); }
.steps .step { display: inline-flex; align-items: center; gap: 6px; }
.steps .step i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 12px; border: 1px solid var(--border-strong); }
.steps .step.on { color: var(--text); }
.steps .step.on i { background: var(--neon); color: var(--neon-ink); border-color: var(--neon); }
.steps .step.done i { background: var(--surface-2); color: var(--neon); }
.steps .sep { flex: 1; height: 1px; background: var(--border); max-width: 40px; }
.choice { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); width: 100%; text-align: left; transition: all 0.2s; }
.choice[aria-checked="true"] { border-color: var(--neon); background: rgba(214, 255, 63, 0.06); }
.choice .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); flex: none; display: grid; place-items: center; }
.choice[aria-checked="true"] .radio { border-color: var(--neon); }
.choice[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--neon); }
.choice .grow { flex: 1; }
.choice small { display: block; color: var(--muted); font-size: 12.5px; font-weight: 500; }
.choices { display: grid; gap: 10px; }
.summary-box { border-radius: 22px; background: var(--surface); border: 1px solid var(--border); padding: 14px; }
.summary-box summary { list-style: none; display: flex; justify-content: space-between; align-items: center; font-weight: 800; cursor: pointer; }
.summary-box summary::-webkit-details-marker { display: none; }
.mini-line { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; font-size: 13.5px; padding: 6px 0; }
.mini-line .art { width: 46px; height: 54px; border-radius: 10px; }
.mini-line .qtyb { position: absolute; }
.demo-note { font-size: 12.5px; color: var(--muted); padding: 12px 14px; border-radius: 14px; background: rgba(157, 123, 255, 0.1); border: 1px solid rgba(157, 123, 255, 0.3); }
.success-icon { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--neon); color: var(--neon-ink); box-shadow: 0 0 60px rgba(214, 255, 63, 0.6); animation: popin 0.7s var(--spring) both; margin: 0 auto 22px; }
@keyframes popin { from { transform: scale(0); } }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); } }

/* toast */
.toasts { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top)); z-index: 95; transform: translateX(-50%); display: grid; gap: 8px; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; background: rgba(30, 22, 46, 0.92); border: 1px solid var(--border-strong); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 16px 40px -14px rgba(0, 0, 0, 0.8); animation: toastin 0.45s var(--spring); }
.toast svg { color: var(--neon); flex: none; }
.toast.out { animation: toastout 0.3s var(--ease) forwards; }
@keyframes toastin { from { opacity: 0; transform: translateY(-20px) scale(0.95); } }
@keyframes toastout { to { opacity: 0; transform: translateY(-10px); } }

/* scroll reveal */
.js [data-reveal] { opacity: 0; transform: translateY(30px) scale(0.98); transition: opacity 0.85s var(--ease), transform 0.85s var(--ease); transition-delay: var(--delay, 0ms); }
.js [data-reveal].is-in { opacity: 1; transform: none; }
.view-enter { animation: viewin 0.5s var(--ease); }
@keyframes viewin { from { opacity: 0; transform: translateY(12px); } }

/* ---------- Larger screens ---------- */
@media (min-width: 560px) {
  .rail { grid-auto-columns: 40%; }
  .bento { grid-template-columns: repeat(3, 1fr); }
  .bento-tile.wide { grid-column: span 1; grid-row: span 2; }
  .insta { grid-template-columns: repeat(6, 1fr); }
}
@media (min-width: 640px) {
  :root { --gutter: 24px; }

  .footer-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
}
@media (min-width: 960px) {

  main { padding-bottom: 40px; }
  .section { padding: 80px 0; }
  .rail { grid-auto-columns: calc(25% - 9px); margin: 0; padding: 4px 0 10px; }
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .hero-content { padding-top: 160px; }
  .hero-content > * { max-width: 700px; }
  .float-card { width: 22vw; max-width: 290px; }
  .float-card.f1 { right: 7vw; top: 16vh; }
  .float-card.f2 { display: block; left: auto; right: 25vw; top: 56vh; width: 13vw; opacity: 0.9; }
  .float-card.f3 { left: auto; right: 3vw; top: 60vh; width: 12vw; opacity: 0.8; }
  .bento { grid-template-columns: repeat(4, 1fr); }
  .bento-tile { min-height: 240px; }
  .spotlight { grid-template-columns: 1fr 1fr; align-items: center; padding: 26px; gap: 44px; }
  .bundle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .cream { padding: 44px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .pdp-layout { grid-template-columns: 1.15fr 1fr; gap: 54px; align-items: start; }
  .gallery { margin: 0; position: sticky; top: calc(var(--header-h) + 24px); }
  .gallery-track { padding: 0; }
  .thumbs { justify-content: flex-start; padding: 0; }
  .sticky-buy { display: none; }
  .review-list { grid-template-columns: 1fr 1fr; }
  .newsletter { padding: 60px; }
  .checkout-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }
  .checkout-grid .summary-col { position: sticky; top: calc(var(--header-h) + 30px); }
  .toolbar { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; }
  .chips { margin: 0; padding: 2px 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  .js [data-reveal] { opacity: 1; transform: none; }
}
.card-media .alt { position: absolute; inset: 0; }
.cart-extras { display: grid; gap: 10px; margin-top: 14px; padding: 14px; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border); }

.drawer-total small { font-size: 12px; font-weight: 600; color: var(--muted); }

  function shopList() {

      if (s.sale && !p.compare_at_price) return false
      if (q && (p.title + " " + p.subtitle + " " + p.description + " " + (CAT_NAMES[p.category] || "")).toLowerCase().indexOf(q) < 0) return false
      return true
    })
    var sorters = {
      pop: function (a, b) { return b.popularity - a.popularity },
      asc: function (a, b) { return a.price - b.price },
      desc: function (a, b) { return b.price - a.price },
      rating: function (a, b) { return ratingOf(b) - ratingOf(a) || reviewsOf(b).length - reviewsOf(a).length },
      new: function (a, b) { return b.index - a.index },
    }
    return list.sort(sorters[s.sort] || sorters.pop)
  }

      (list.length ? list.map(function (r, i) { return reviewCard(r, p, { helpful: true, reveal: true, i: i }) }).join("") : '<p class="muted">Noch keine Bewertungen mit ' + pdp.filter + " Sternen.</p>")
    observe($("#review-list"))
  }

  function updateFbt() {
    var p = byHandle[current.params.handle]
    var sum = priceOf(p, pdp.vi), n = 1
    Object.keys(pdp.fbt).forEach(function (h) { if (pdp.fbt[h]) { sum += byHandle[h].price; n++ } })
    $("#fbt-add").innerHTML = I.bag(18) + " " + (n === 1 ? "Nur dieses Produkt" : "Alle " + n) + " hinzufügen · " + eur(sum)
  }

  function setVariant(p, vi) {
    pdp.vi = vi
    $$("[data-variant]").forEach(function (b) { b.setAttribute("aria-checked", String(Number(b.dataset.variant) === vi)) })
    var modes = ["studio", "detail", "pattern"]
    $$("#track .gallery-slide").forEach(function (s, i) { s.innerHTML = ART.scene(p, colorOf(p, vi), modes[i]) })
    $$(".thumbs .art").forEach(function (a, i) { a.innerHTML = ART.scene(p, colorOf(p, vi), modes[i]) })
    $("#sticky-buy .art").innerHTML = ART.scene(p, colorOf(p, vi), "studio")
    var price = priceOf(p, vi)
    $("#pdp-price").textContent = eur(price)
    $("#sticky-price").textContent = eur(price)
    $("#klarna").innerHTML = "oder 3 × <b>" + eur(price / 3) + "</b> mit Klarna, zinsfrei"
    if ($("#vname")) $("#vname").textContent = p.option.values[vi]
    updateFbt()
  }

  function viewWishlist() {
    var list = state.wish.map(function (h) { return byHandle[h] }).filter(Boolean)

        : '<div class="empty"><div class="empty-icon">' + I.heart(30) + '</div><h3>Noch nichts gemerkt</h3><p>Tippe auf das Herz bei einem Produkt, um es hier zu speichern.</p><a class="btn btn-neon" href="#/shop">Shop entdecken</a></div>') +
      "</div>" + footer()

  // ---------- checkout ----------
  function viewCheckout() {
    var t = totals(state.checkout.ship)
    if (!t.count) {
      return '<div class="container page-top view-enter"><div class="empty"><div class="empty-icon">' + I.bag(30) + '</div><h3>Dein Warenkorb ist leer</h3><p>Füge zuerst ein paar Lieblinge hinzu.</p><a class="btn btn-neon" href="#/shop">Zum Shop</a></div></div>'
    }
    var c = state.checkout, f = c.form
    var steps = ["Adresse", "Versand", "Zahlung"]
    var stepHtml = '<div class="steps">' + steps.map(function (s, i) {
      var n = i + 1
      return (i ? '<span class="sep"></span>' : "") + '<span class="step' + (n === c.step ? " on" : n < c.step ? " done" : "") + '"><i>' + (n < c.step ? "✓" : n) + "</i>" + s + "</span>"
    }).join("") + "</div>"
    var body = ""
    if (c.step === 1) {
      body = '<form id="addr" class="form-grid" novalidate>' +
        field("email", "E-Mail", "email", f.email, "email") +
        '<div class="form-2">' + field("first", "Vorname", "text", f.first, "given-name") + field("last", "Nachname", "text", f.last, "family-name") + "</div>" +
        field("street", "Straße und Hausnummer", "text", f.street, "street-address") +
        '<div class="form-3">' + field("zip", "PLZ", "text", f.zip, "postal-code", 'inputmode="numeric"') + field("city", "Ort", "text", f.city, "address-level2") + "</div>" +
        '<div class="field"><label for="f-country">Land</label><div class="select"><select id="f-country" name="country" class="input" style="border-radius:14px">' +
        [["AT", "Österreich"], ["DE", "Deutschland"], ["CH", "Schweiz"]].map(function (o) { return '<option value="' + o[0] + '"' + ((f.country || "AT") === o[0] ? " selected" : "") + ">" + o[1] + "</option>" }).join("") + "</select></div></div>" +
        '<button class="btn btn-neon btn-block" type="submit">Weiter zum Versand ' + I.arrow(18) + "</button></form>"
    } else if (c.step === 2) {
      body = '<div class="choices" role="radiogroup" aria-label="Versandart">' +
        choice("ship", "std", c.ship === "std", "Standardversand", "2-4 Werktage · " + deliveryRange(), totals("std").shipping ? eur(STD_SHIPPING) : "Gratis") +
        choice("ship", "express", c.ship === "express", "Express", "1-2 Werktage", eur(EXPRESS_SHIPPING)) + "</div>" +
        '<p class="muted" style="font-size:13px;margin:14px 0">Lieferung an ' + esc(f.first + " " + f.last) + ", " + esc(f.street) + ", " + esc(f.zip + " " + f.city) + ' · <button style="color:var(--neon);font-weight:700" data-step="1">Ändern</button></p>' +
        '<button class="btn btn-neon btn-block" data-step="3">Weiter zur Zahlung ' + I.arrow(18) + "</button>"
    } else {
      body = '<div class="choices" role="radiogroup" aria-label="Zahlungsart">' +
        choice("pay", "card", c.pay === "card", "Kreditkarte", "Visa, Mastercard, Amex", "") +
        choice("pay", "paypal", c.pay === "paypal", "PayPal", "Schnell und sicher", "") +
        choice("pay", "klarna", c.pay === "klarna", "Klarna", "Später oder in 3 Raten zahlen", "") +
        choice("pay", "eps", c.pay === "eps", "EPS-Überweisung", "Direkt über deine Bank", "") + "</div>" +
        '<p class="demo-note" style="margin:16px 0">Demo-Shop: Es wird nichts bezahlt und keine Zahlungsdaten werden abgefragt. Mit Medusa wird hier später der echte Zahlungsanbieter eingebunden.</p>' +
        '<button class="btn btn-neon btn-block" data-action="place-order">Jetzt kaufen · ' + eur(t.total) + "</button>" +
        '<button class="btn btn-glass btn-block" style="margin-top:8px" data-step="2">' + I.back(18) + " Zurück</button>"
    }
    return '<div class="container page-top view-enter"><a href="#/shop" class="back-link" style="padding-top:0">' + I.back(18) + ' Weiter einkaufen</a><h1 class="title-xl" style="margin-bottom:18px">Kasse</h1>' +
      '<div class="checkout-grid"><div>' + stepHtml + body + '</div><div class="summary-col">' + summary(t, true) + "</div></div></div>"
  }
  function field(name, label, type, value, ac, extra) {
    return '<div class="field"><label for="f-' + name + '">' + label + '</label><input class="input" id="f-' + name + '" name="' + name + '" type="' + type + '" value="' + esc(value || "") + '" autocomplete="' + ac + '" required ' + (extra || "") + '><span class="err" id="e-' + name + '"></span></div>'
  }
  function choice(group, value, on, title, sub, right) {
    return '<button type="button" class="choice" role="radio" data-' + group + '="' + value + '" aria-checked="' + on + '"><span class="radio"></span><span class="grow"><b>' + title + "</b><small>" + sub + "</small></span>" + (right ? "<b>" + right + "</b>" : "") + "</button>"
  }
  function summary(t, collapsible) {
    var lines = state.cart.map(function (l) {
      var p = byHandle[l.handle]
      return '<div class="mini-line">' + art(p, l.vi, "studio") + "<span><b>" + esc(p.title) + "</b><br><span class=\"muted\">" + (p.option.values.length > 1 ? esc(p.option.values[l.vi]) + " · " : "") + l.qty + " Stück</span></span><b>" + eur(priceOf(p, l.vi) * l.qty) + "</b></div>"
    }).join("")
    var tot = totalsHtml(t)
    return '<details class="summary-box"' + (window.innerWidth >= 960 || !collapsible ? " open" : "") + "><summary><span>Bestellübersicht (" + t.count + ")</span><span>" + eur(t.total) + '</span></summary><div style="margin-top:10px">' + lines + '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:12px">' + tot + "</div></div></details>"
  }
  function totalsHtml(t) {
    return '<div class="totals"><div class="row"><span class="muted">Zwischensumme</span><span>' + eur(t.sub) + "</span></div>" +
      (t.bundle ? '<div class="row discount"><span>' + BUNDLE.name + " −" + BUNDLE.pct + " %</span><span>−" + eur(t.bundle) + "</span></div>" : "") +
      (t.code ? '<div class="row discount"><span>' + esc(state.code) + " · " + t.code.label + "</span><span>−" + eur(t.codeOff) + "</span></div>" : "") +
      '<div class="row"><span class="muted">Versand</span><span>' + (t.shipping ? eur(t.shipping) : "Gratis") + "</span></div>" +
      '<div class="row grand"><span>Gesamt</span><span>' + eur(t.total) + '</span></div><span class="muted" style="font-size:12px">inkl. MwSt.</span></div>'
  }
  function validateAddress(form) {
    var data = {}, ok = true
    ;["email", "first", "last", "street", "zip", "city"].forEach(function (n) {
      var input = form.elements[n], v = input.value.trim(), msg = ""
      if (!v) msg = "Bitte ausfüllen"
      else if (n === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) msg = "Bitte eine gültige E-Mail-Adresse eingeben"
      else if (n === "zip" && !/^\d{4,5}$/.test(v)) msg = "4- oder 5-stellige PLZ"
      $("#e-" + n).textContent = msg
      input.classList.toggle("invalid", !!msg)
      input.setAttribute("aria-invalid", String(!!msg))
      if (msg && ok) { ok = false; input.focus() }
      data[n] = v
    })
    data.country = form.elements.country.value
    return ok ? data : null
  }
  function placeOrder() {
    var t = totals(state.checkout.ship)
    var no = "VM-" + String(Date.now()).slice(-6)
    var order = { no: no, total: t.total, count: t.count, items: state.cart.slice(), at: Date.now(), name: state.checkout.form.first, email: state.checkout.form.email }
    state.orders.unshift(order)
    store.set("orders", state.orders.slice(0, 10))
    state.cart = []
    state.code = null
    store.set("code", null)
    saveCart()
    state.checkout.step = 1
    location.hash = "#/danke/" + no
  }
  function viewThanks(no) {
    var o = state.orders.find(function (x) { return x.no === no })
    if (!o) return '<div class="container page-top"><div class="empty"><h3>Bestellung nicht gefunden</h3><a class="btn btn-neon" href="#/">Zur Startseite</a></div></div>'
    return '<div class="container page-top view-enter" style="text-align:center;max-width:560px;padding-top:50px"><div class="success-icon">' + I.check(44) + "</div>" +
      '<span class="eyebrow">Bestellung ' + esc(o.no) + '</span><h1 class="title-xl">Danke, <span class="serif gradient-text">' + esc(o.name) + "!</span></h1>" +
      '<p class="muted" style="margin:14px 0 26px">Deine Bestellung über ' + eur(o.total) + " ist eingegangen. Die Bestätigung geht an " + esc(o.email) + ". Lieferung voraussichtlich " + deliveryRange() + ".</p>" +
      '<div class="demo-note" style="text-align:left;margin-bottom:22px">Demo-Shop: Es wurde nichts bestellt oder bezahlt.</div>' +
      '<a class="btn btn-neon" href="#/shop">Weiter shoppen ' + I.arrow(18) + "</a></div>"
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return
    var box = make("div", "confetti", { "aria-hidden": "true" })
    var colors = ["#d6ff3f", "#ff5fd2", "#9d7bff", "#6ff2cf", "#ffb38a", "#ffd25e"]
    for (var i = 0; i < 90; i++) {
      var c = document.createElement("i")
      c.style.left = Math.random() * 100 + "vw"
      c.style.background = colors[i % colors.length]
      c.style.setProperty("--dx", (Math.random() * 200 - 100).toFixed(0) + "px")
      c.style.setProperty("--rot", (Math.random() * 1080 - 540).toFixed(0) + "deg")
      c.style.animationDuration = (2.2 + Math.random() * 1.8).toFixed(2) + "s"
      c.style.animationDelay = (Math.random() * 0.4).toFixed(2) + "s"
      box.appendChild(c)
    }
    document.body.appendChild(box)
    setTimeout(function () { box.remove() }, 4800)
  }

  // ---------- cart drawer ----------
  var cartEl = null
  function openCart() {
    if (cartEl) { renderCart(); return }
    cartEl = make("aside", "drawer glass", { role: "dialog", "aria-modal": "true", "aria-label": "Warenkorb" })
    openOverlay(cartEl, { onClose: function () { cartEl = null } })
    renderCart()
  }
  function renderCart() {
    var t = totals()
    var missing = Math.max(0, FREE_SHIPPING - t.afterDiscount)
    var html = '<div class="drawer-head"><h2>Warenkorb <span class="muted" style="font-size:16px">(' + t.count + ')</span></h2><button class="icon-btn" data-close data-autofocus aria-label="Warenkorb schließen">' + I.close() + "</button></div>"
    if (!t.count) {
      html += '<div class="drawer-body"><div class="empty"><div class="empty-icon">' + I.bag(30) + '</div><h3>Noch leer hier</h3><p>Entdecke unsere Bestseller und gönn dir was.</p><a class="btn btn-neon" href="#/shop" data-close>Produkte entdecken</a></div></div>'
      cartEl.innerHTML = html
      return
    }
    var inCart = {}
    state.cart.forEach(function (l) { inCart[l.handle] = true })
    var upsell = products.filter(function (p) { return !inCart[p.handle] && p.price < 35 }).sort(function (a, b) { return b.popularity - a.popularity })[0]
    html += '<div class="drawer-body"><div class="ship-progress">' + (missing > 0 ? "Noch <b style=\"color:var(--text)\">" + eur(missing) + "</b> bis zum Gratisversand" : '<b style="color:var(--neon)">Du bekommst Gratisversand!</b>') +
      '<div class="progress-track"><span style="width:' + Math.min(100, (t.afterDiscount / FREE_SHIPPING) * 100) + '%"></span></div></div>'
    state.cart.forEach(function (l) {
      var p = byHandle[l.handle]
      html += '<div class="line"><a href="#/p/' + p.handle + '" data-close>' + art(p, l.vi, "studio") + "</a><div>" +
        '<div class="row between" style="align-items:flex-start"><div><div class="line-title">' + esc(p.title) + "</div>" + (p.option.values.length > 1 ? '<div class="line-sub">' + esc(p.option.title + ": " + p.option.values[l.vi]) + "</div>" : "") + "</div>" +
        '<button class="line-remove" data-remove="' + l.key + '" aria-label="' + esc(p.title) + ' entfernen">' + I.trash(18) + "</button></div>" +
        '<div class="line-foot"><div class="qty sm"><button data-q="' + l.key + '" data-d="-1" aria-label="Weniger">−</button><span>' + l.qty + '</span><button data-q="' + l.key + '" data-d="1" aria-label="Mehr">+</button></div><b>' + eur(priceOf(p, l.vi) * l.qty) + "</b></div></div></div>"
    })
    if (t.bundle) html += '<p class="demo-note" style="margin-bottom:10px">' + I.gift(16) + " " + BUNDLE.name + " erkannt: −" + BUNDLE.pct + " % auf die drei Produkte.</p>"
    if (upsell) html += '<p style="font-size:13px;font-weight:800;margin:14px 4px 4px">Passt dazu</p><div class="upsell">' + art(upsell, 0, "studio") + "<span>" + esc(upsell.title) + '<br><span class="muted">' + eur(upsell.price) + '</span></span><button class="btn btn-neon btn-sm" data-upsell="' + upsell.handle + '">' + I.plus(16) + "</button></div>"
    html += '<div class="cart-extras"><form class="code-form" id="code-form"><label for="code" class="sr-only">Rabattcode</label><input class="input" id="code" placeholder="Rabattcode" value="' + esc(state.code || "") + '" autocomplete="off"><button class="btn btn-glass btn-sm" type="submit">' + (state.code ? "Ändern" : "Einlösen") + '</button></form><p class="code-msg" id="code-msg"></p>' + totalsHtml(t) + "</div></div>" +
      '<div class="drawer-foot"><div class="drawer-total"><span>Gesamt <small>inkl. MwSt.' + (t.shipping ? "" : ", gratis Versand") + '</small></span><span>' + eur(t.total) + '</span></div><a class="btn btn-neon btn-block" href="#/kasse" data-close>Zur Kasse ' + I.arrow(18) + "</a></div>"
    cartEl.innerHTML = html
  }

  // ---------- quick view ----------
  function openQuick(p) {
    var vi = 0, qty = 1
    var el = make("div", "sheet glass", { role: "dialog", "aria-modal": "true", "aria-label": "Schnellansicht " + p.title })
    function draw() {
      el.innerHTML = '<div style="overflow-y:auto;padding:12px 18px calc(18px + env(safe-area-inset-bottom))">' +
        '<div class="row" style="align-items:flex-start;gap:14px"><div class="art" style="width:118px;height:148px;border-radius:20px;flex:none">' + ART.scene(p, colorOf(p, vi), "studio") + "</div>" +
        '<div style="flex:1;min-width:0"><div class="row between" style="align-items:flex-start"><span class="eyebrow">' + esc(CAT_NAMES[p.category]) + '</span><button class="icon-btn" data-close aria-label="Schließen" style="width:38px;height:38px;margin:-4px -4px 0 0">' + I.close(18) + "</button></div>" +
        '<h3 style="font-size:22px;margin:6px 0">' + esc(p.title) + '</h3><div class="row" style="gap:6px;font-size:13px">' + stars(ratingOf(p), 13) + '<span class="muted">(' + reviewsOf(p).length + ")</span></div>" +
        '<div class="price-row" style="margin-top:6px"><span class="price" style="font-size:22px">' + eur(priceOf(p, vi)) + "</span>" + (p.compare_at_price ? '<span class="price-old">' + eur(p.compare_at_price) + "</span>" : "") + "</div></div></div>" +
        (p.option.values.length > 1 ? '<div class="opt-label" style="margin-top:18px"><span>' + esc(p.option.title) + ": <b>" + esc(p.option.values[vi]) + '</b></span></div><div class="swatches" role="radiogroup" aria-label="' + esc(p.option.title) + '">' +
          p.option.values.map(function (v, i) { return '<button class="chip" role="radio" data-qv="' + i + '" aria-checked="' + (i === vi) + '">' + esc(v) + "</button>" }).join("") + "</div>" : '<div style="height:18px"></div>') +
        '<div class="buy-row"><div class="qty"><button data-qq="-1" aria-label="Weniger">−</button><span>' + qty + '</span><button data-qq="1" aria-label="Mehr">+</button></div><button class="btn btn-neon" data-qadd>' + I.bag(18) + " Hinzufügen · " + eur(priceOf(p, vi) * qty) + "</button></div>" +
        '<a href="#/p/' + p.handle + '" class="link-more" style="margin-top:14px;display:flex;justify-content:center" data-close>Alle Details ansehen ' + I.arrow(16) + "</a></div>"
    }
    el.addEventListener("click", function (e) {
      var t = e.target.closest("button, a")
      if (!t) return
      if (t.dataset.qv) { vi = Number(t.dataset.qv); draw() }
      else if (t.dataset.qq) { qty = Math.max(1, Math.min(9, qty + Number(t.dataset.qq))); draw() }
      else if (t.hasAttribute("data-qadd")) { closeOverlay(el); addToCart(p, vi, qty) }
    })
    draw()
    openOverlay(el)
  }

  // ---------- search ----------
  function openSearch() {
    var el = make("div", "fullscreen", { role: "dialog", "aria-modal": "true", "aria-label": "Suche" })
    el.innerHTML = '<form class="search-bar" id="search-form" role="search"><label class="search-input">' + I.search() + '<span class="sr-only">Suchbegriff</span><input id="sq" type="search" placeholder="Wonach suchst du?" autocomplete="off" enterkeyhint="search" data-autofocus></label><button type="button" class="icon-btn" data-close aria-label="Suche schließen">' + I.close() + "</button></form>" +
      '<div class="search-body" id="search-body"></div>'
    var body = el.querySelector("#search-body"), input = el.querySelector("#sq")
    function draw() {
      var q = input.value.trim().toLowerCase()
      if (!q) {
        body.innerHTML = '<p class="eyebrow" style="margin:10px 0 12px">Beliebte Suchen</p><div class="row" style="flex-wrap:wrap;gap:8px">' +
          ["Massage", "Gua Sha", "Schlaf", "Aroma", "Yoga", "Wärme"].map(function (s) { return '<button class="chip" data-term="' + s + '">' + s + "</button>" }).join("") + "</div>" +
          '<p class="eyebrow" style="margin:28px 0 8px">Bestseller</p>' + products.slice().sort(function (a, b) { return b.popularity - a.popularity }).slice(0, 4).map(result).join("")
        return
      }
      var hits = products.filter(function (p) { return (p.title + " " + p.subtitle + " " + p.description + " " + CAT_NAMES[p.category]).toLowerCase().indexOf(q) >= 0 })
      body.innerHTML = hits.length
        ? '<p class="muted" style="font-size:13px;margin:6px 0 8px">' + hits.length + " Treffer</p>" + hits.map(result).join("") + '<button class="btn btn-glass btn-block" style="margin-top:14px" data-all>Alle Ergebnisse im Shop</button>'
        : '<div class="empty"><div class="empty-icon">' + I.search(30) + "</div><h3>Keine Treffer für „" + esc(input.value) + "“</h3><p>Versuch es mit „Massage“, „Öl“ oder „Schlaf“.</p></div>"
      function hl(s) { var i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length)) }
      $$(".result b", body).forEach(function (b) { b.innerHTML = hl(b.textContent) })
    }
    function result(p) {
      return '<a class="result" href="#/p/' + p.handle + '" data-close>' + art(p, 0, "studio") + "<span><b>" + esc(p.title) + '</b><br><span class="muted" style="font-size:13px">' + esc(CAT_NAMES[p.category]) + "</span></span><b>" + eur(p.price) + "</b></a>"
    }
    function goShop() {
      pendingQuery = input.value.trim()
      closeOverlay(el)
      navigate("#/shop")
    }
    input.addEventListener("input", draw)
    el.querySelector("#search-form").addEventListener("submit", function (e) { e.preventDefault(); if (input.value.trim()) goShop() })
    el.addEventListener("click", function (e) {
      var t = e.target.closest("[data-term],[data-all]")
      if (!t) return
      if (t.dataset.term) { input.value = t.dataset.term; draw(); input.focus() }
      else goShop()
    })
    draw()
    openOverlay(el, { noScrim: true })
  }

  // ---------- menu ----------

  function openStory(si) {
    var el = make("div", "story", { role: "dialog", "aria-modal": "true", "aria-label": "Story" })
    var slide = 0, timer = null, start = 0, elapsed = 0, paused = false, DUR = 5500
    function markSeen(id) {
      if (state.seenStories.indexOf(id) < 0) { state.seenStories.push(id); store.set("stories", state.seenStories) }
      var b = $('[data-story="' + STORIES.findIndex(function (s) { return s.id === id }) + '"]')
      if (b) b.classList.add("seen")
    }
    function draw() {
      var s = STORIES[si], sl = s.slides[slide], p = byHandle[sl.p]
      markSeen(s.id)
      el.innerHTML = '<div class="story-frame">' + art(p, sl.v || 0, slide % 2 ? "pattern" : "studio") +
        '<div class="story-bars">' + s.slides.map(function (_, i) { return "<i><b" + (i < slide ? ' style="width:100%"' : "") + "></b></i>" }).join("") + "</div>" +
        '<div class="story-head"><span class="mini">' + art(byHandle[s.slides[0].p], 0, "detail") + "</span>" + esc(s.title) + '<button class="icon-btn" data-close aria-label="Story schließen">' + I.close() + "</button></div>" +
        '<button class="story-tap prev" aria-label="Zurück"></button><button class="story-tap next" aria-label="Weiter"></button>' +
        '<div class="story-text"><h3>' + esc(sl.h) + "</h3><p>" + esc(sl.t) + '</p><a class="btn btn-neon" href="#/p/' + p.handle + '" data-close>' + esc(p.title) + " ansehen " + I.arrow(18) + "</a></div></div>"
      elapsed = 0
      el.querySelector(".story-head .icon-btn").focus({ preventScroll: true })
      run()
    }
    function run() {
      cancelAnimationFrame(timer)
      start = performance.now() - elapsed
      function tick(t) {
        if (paused) return
        elapsed = t - start
        var bar = el.querySelectorAll(".story-bars b")[slide]
        if (bar) bar.style.width = Math.min(100, (elapsed / DUR) * 100) + "%"
        if (elapsed >= DUR) next()
        else timer = requestAnimationFrame(tick)
      }
      timer = requestAnimationFrame(tick)
    }
    function next() {
      if (slide < STORIES[si].slides.length - 1) slide++
      else if (si < STORIES.length - 1) { si++; slide = 0 }
      else return closeOverlay(el)
      draw()
    }
    function prev() {
      if (slide > 0) slide--
      else if (si > 0) { si--; slide = STORIES[si].slides.length - 1 }
      draw()
    }
    el.addEventListener("click", function (e) {
      if (e.target.closest(".story-tap.next")) next()
      else if (e.target.closest(".story-tap.prev")) prev()
    })
    el.addEventListener("pointerdown", function (e) { if (e.target.closest(".story-tap")) { paused = true } })
    el.addEventListener("pointerup", function () { if (paused) { paused = false; run() } })
    el.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") next(); if (e.key === "ArrowLeft") prev() })
    openOverlay(el, { noScrim: true, onClose: function () { cancelAnimationFrame(timer) } })
    draw()
  }
