<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0913">
<title>Vermont | Wellness & Massage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<style>
:root {
  --bg: #0c0913;
  --bg-2: #15101f;
  --surface: rgba(255, 255, 255, 0.06);
  --surface-strong: rgba(255, 255, 255, 0.1);
  --border: rgba(255, 255, 255, 0.12);
  --text: #f7f3ff;
  --muted: rgba(247, 243, 255, 0.64);
  --neon: #d6ff3f;
  --neon-ink: #121405;
  --pink: #ff5fd2;
  --violet: #9d7bff;
  --peach: #ffb38a;
  --mint: #6ff2cf;
  --star: #ffd25e;
  --radius: 22px;
  --radius-sm: 14px;
  --gutter: 16px;
  --header-h: 60px;
  --font: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system,
    "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100svh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* Soft gradient mesh behind everything. Static, so it costs nothing while scrolling. */
body::before {
  content: "";
  position: fixed;
  inset: -20vh -20vw;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(40vmax 40vmax at 10% 10%, rgba(157, 123, 255, 0.28), transparent 60%),
    radial-gradient(36vmax 36vmax at 90% 25%, rgba(255, 95, 210, 0.2), transparent 60%),
    radial-gradient(40vmax 40vmax at 50% 95%, rgba(111, 242, 207, 0.14), transparent 60%),
    radial-gradient(30vmax 30vmax at 85% 80%, rgba(255, 179, 138, 0.14), transparent 60%);
}

img,
video {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

:focus-visible {
  outline: 2px solid var(--neon);
  outline-offset: 3px;
}

h1,
h2,
h3 {
  margin: 0;
  letter-spacing: -0.03em;
  line-height: 1.05;
}

p {
  margin: 0;
}

.container {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--gutter);
}

.section {
  padding: 56px 0;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--neon);
}

.section-title {
  font-size: clamp(30px, 8vw, 52px);
  font-weight: 800;
  margin-top: 10px;
}

.gradient-text {
  background: linear-gradient(100deg, var(--peach), var(--pink) 45%, var(--violet));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.muted {
  color: var(--muted);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- Glass ---------- */
.glass {
  background: rgba(22, 16, 34, 0.55);
  border: 1px solid var(--border);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  backdrop-filter: blur(18px) saturate(160%);
}

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 52px;
  padding: 0 26px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 700;
  font-size: 16px;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease),
    background 0.25s;
  -webkit-tap-highlight-color: transparent;
}

.btn:active {
  transform: scale(0.97);
}

.btn-neon {
  background: var(--neon);
  color: var(--neon-ink);
  box-shadow: 0 0 0 0 rgba(214, 255, 63, 0.5), 0 10px 40px -10px rgba(214, 255, 63, 0.7);
}

.btn-neon:hover {
  box-shadow: 0 0 0 4px rgba(214, 255, 63, 0.18), 0 14px 50px -10px rgba(214, 255, 63, 0.9);
}

.btn-glass {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.24);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
}

.btn-block {
  width: 100%;
}

.icon-btn {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  -webkit-tap-highlight-color: transparent;
}

/* ---------- Header ---------- */
.header {
  position: fixed;
  top: 10px;
  left: 10px;
  right: 10px;
  z-index: 40;
  height: var(--header-h);
  border-radius: 999px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 8px 0 20px;
  max-width: 1180px;
  margin: 0 auto;
  transition: background 0.3s;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.05em;
}

.logo span {
  color: var(--neon);
  text-shadow: 0 0 18px rgba(214, 255, 63, 0.8);
}

.header-nav {
  display: none;
  gap: 26px;
  font-weight: 600;
  font-size: 15px;
  color: var(--muted);
}

.header-nav a:hover {
  color: var(--text);
}

.cart-btn {
  position: relative;
}

.cart-count {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--pink);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  display: grid;
  place-items: center;
  box-shadow: 0 0 14px rgba(255, 95, 210, 0.9);
}

.cart-count.bump {
  animation: bump 0.45s var(--ease);
}

@keyframes bump {
  40% {
    transform: scale(1.45);
  }
}

/* ---------- Hero ---------- */
.hero {
  position: relative;
  min-height: 92svh;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
  border-radius: 0 0 36px 36px;
  isolation: isolate;
}

.hero-media,
.hero-media > img,
.hero-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

.hero-video {
  opacity: 0;
  transition: opacity 1s var(--ease);
}

.hero-video.is-playing {
  opacity: 1;
}

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    linear-gradient(180deg, rgba(12, 9, 19, 0.2) 0%, rgba(12, 9, 19, 0) 30%, rgba(12, 9, 19, 0.75) 72%, var(--bg) 100%),
    linear-gradient(120deg, rgba(157, 123, 255, 0.35), rgba(255, 95, 210, 0.15) 50%, transparent);
}

.hero-content {
  padding-bottom: 44px;
  padding-top: 120px;
}

.hero-title {
  font-size: clamp(44px, 13vw, 96px);
  font-weight: 800;
  letter-spacing: -0.05em;
  line-height: 0.95;
  margin: 14px 0 16px;
}

.hero-sub {
  font-size: 17px;
  color: rgba(247, 243, 255, 0.82);
  max-width: 440px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}

.hero-proof {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
  font-size: 14px;
  color: var(--muted);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}

.dot-live {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon);
  box-shadow: 0 0 10px var(--neon);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  50% {
    opacity: 0.35;
  }
}

/* ---------- Marquee ---------- */
.marquee {
  overflow: hidden;
  border-block: 1px solid var(--border);
  background: linear-gradient(90deg, rgba(157, 123, 255, 0.12), rgba(255, 95, 210, 0.12));
  padding: 14px 0;
  margin-top: 28px;
}

.marquee-track {
  display: flex;
  width: max-content;
  gap: 40px;
  animation: marquee 28s linear infinite;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}

.marquee-track span::after {
  content: "\2726";
  margin-left: 40px;
  color: var(--neon);
}

@keyframes marquee {
  to {
    transform: translateX(-50%);
  }
}

/* ---------- Chips ---------- */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 22px calc(var(--gutter) * -1) 22px;
  padding: 2px var(--gutter);
  scroll-snap-type: x proximity;
}

.chips::-webkit-scrollbar {
  display: none;
}

.chip {
  flex: none;
  scroll-snap-align: start;
  min-height: 42px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
  font-size: 14px;
  transition: all 0.25s var(--ease);
  -webkit-tap-highlight-color: transparent;
}

.chip[aria-pressed="true"],
.chip[aria-checked="true"] {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

/* ---------- Product grid ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  overflow: hidden;
  transition: transform 0.4s var(--ease), border-color 0.3s, box-shadow 0.4s;
  -webkit-tap-highlight-color: transparent;
}

.card:active {
  transform: scale(0.98);
}

@media (hover: hover) {
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 95, 210, 0.5);
    box-shadow: 0 20px 50px -20px rgba(255, 95, 210, 0.55);
  }
  .card:hover .card-media img {
    transform: scale(1.06);
  }
}

.card-media {
  position: relative;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: linear-gradient(135deg, #2a1f43, #3b1d3a);
}

.card-media img {
  object-fit: cover;
  transition: transform 0.8s var(--ease);
}

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 1;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(12, 9, 19, 0.55);
  border: 1px solid rgba(214, 255, 63, 0.55);
  color: var(--neon);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 12px 14px;
  flex: 1;
}

.card-title {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.card-rating {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}

.price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: auto;
  padding-top: 4px;
}

.price {
  font-weight: 800;
  font-size: 17px;
}

.price-old {
  font-size: 13px;
  color: var(--muted);
  text-decoration: line-through;
}

.price-save {
  font-size: 12px;
  font-weight: 800;
  color: var(--pink);
}

/* ---------- Image fallback ---------- */
.img-fallback {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 16px;
  text-align: center;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.02em;
  background:
    radial-gradient(circle at 30% 20%, rgba(255, 179, 138, 0.6), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(157, 123, 255, 0.7), transparent 55%),
    linear-gradient(135deg, #3b2160, #61224f);
}

/* ---------- Stars ---------- */
.stars {
  position: relative;
  display: inline-block;
  line-height: 0;
  flex: none;
}

.stars-fill {
  position: absolute;
  inset: 0 auto 0 0;
  overflow: hidden;
  white-space: nowrap;
  color: var(--star);
  filter: drop-shadow(0 0 4px rgba(255, 210, 94, 0.6));
}

.stars-base {
  color: rgba(255, 255, 255, 0.18);
  white-space: nowrap;
}

.stars svg {
  display: inline-block;
}

/* ---------- Spotlight ---------- */
.spotlight {
  position: relative;
  display: grid;
  gap: 20px;
  border-radius: 30px;
  padding: 18px;
  overflow: hidden;
}

.spotlight::before {
  content: "";
  position: absolute;
  width: 320px;
  height: 320px;
  right: -80px;
  top: -80px;
  border-radius: 50%;
  background: var(--pink);
  filter: blur(90px);
  opacity: 0.45;
  z-index: -1;
}

.spotlight-media {
  position: relative;
  aspect-ratio: 1;
  border-radius: 22px;
  overflow: hidden;
  background: #241a38;
}

.spotlight-media img {
  object-fit: cover;
}

.spotlight h3 {
  font-size: clamp(28px, 7vw, 44px);
  font-weight: 800;
}

.feature-list {
  list-style: none;
  padding: 0;
  margin: 16px 0 22px;
  display: grid;
  gap: 10px;
}

.feature-list li {
  display: flex;
  gap: 10px;
  align-items: center;
  color: rgba(247, 243, 255, 0.85);
}

.feature-list li::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--neon);
  box-shadow: 0 0 10px var(--neon);
  flex: none;
}

/* ---------- Reviews ---------- */
.reviews-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.rating-big {
  display: flex;
  align-items: center;
  gap: 12px;
}

.rating-big strong {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.04em;
}

.review-rail {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  margin: 24px calc(var(--gutter) * -1) 0;
  padding: 4px var(--gutter) 8px;
}

.review-rail::-webkit-scrollbar {
  display: none;
}

.review-card {
  flex: 0 0 82%;
  max-width: 340px;
  scroll-snap-align: center;
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
}

.review-card h4 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.review-card p {
  color: rgba(247, 243, 255, 0.8);
  font-size: 15px;
}

.review-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: auto;
  padding-top: 8px;
  font-size: 13px;
  color: var(--muted);
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 13px;
  color: var(--neon-ink);
  background: linear-gradient(135deg, var(--neon), var(--mint));
  flex: none;
}

.verified {
  color: var(--mint);
  font-weight: 700;
}

.rating-bars {
  display: grid;
  gap: 6px;
  margin: 18px 0 8px;
  font-size: 13px;
}

.rating-bar {
  display: grid;
  grid-template-columns: 34px 1fr 26px;
  align-items: center;
  gap: 10px;
  color: var(--muted);
}

.rating-bar-track {
  height: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.rating-bar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--star), var(--peach));
}

.review-list {
  display: grid;
  gap: 12px;
  margin-top: 18px;
}

.review-list .review-card {
  max-width: none;
}

/* ---------- USPs ---------- */
.usp-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 26px;
}

.usp {
  padding: 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}

.usp-icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  background: linear-gradient(135deg, rgba(157, 123, 255, 0.4), rgba(255, 95, 210, 0.35));
  color: var(--text);
}

.usp h3 {
  font-size: 16px;
  letter-spacing: -0.01em;
  line-height: 1.25;
}

.usp p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

/* ---------- Newsletter ---------- */
.newsletter {
  position: relative;
  padding: 30px 20px;
  border-radius: 30px;
  overflow: hidden;
  text-align: center;
  background:
    radial-gradient(circle at 0% 0%, rgba(255, 95, 210, 0.55), transparent 55%),
    radial-gradient(circle at 100% 100%, rgba(157, 123, 255, 0.6), transparent 55%),
    #1a1228;
  border: 1px solid var(--border);
}

.newsletter h2 {
  font-size: clamp(28px, 8vw, 44px);
  font-weight: 800;
}

.newsletter-form {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  padding: 6px;
  border-radius: 999px;
}

.newsletter-form input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 16px;
  padding: 0 14px;
  outline: none;
}

.newsletter-form .btn {
  min-height: 46px;
  padding: 0 20px;
}

/* ---------- Footer ---------- */
.footer {
  padding: 40px 0 120px;
  color: var(--muted);
  font-size: 14px;
}

.footer-grid {
  display: grid;
  gap: 24px;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 24px;
}

.footer h4 {
  color: var(--text);
  margin: 0 0 8px;
  font-size: 14px;
}

.footer ul {
  list-style: none;
  padding: 0;
  margin: 0;
  display: grid;
  gap: 6px;
}

/* ---------- Cart drawer ---------- */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(5, 3, 10, 0.55);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s var(--ease);
}

.drawer-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 61;
  width: min(420px, 92vw);
  display: flex;
  flex-direction: column;
  border-radius: 28px 0 0 28px;
  border-right: 0;
  background: rgba(20, 14, 32, 0.82);
  transform: translateX(105%);
  transition: transform 0.5s var(--ease);
  visibility: hidden;
}

.drawer.open {
  transform: none;
  visibility: visible;
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 18px 14px 22px;
}

.drawer-head h2 {
  font-size: 24px;
  font-weight: 800;
}

.shipping-progress {
  margin: 0 22px 10px;
  font-size: 13px;
  color: var(--muted);
}

.progress-track {
  height: 6px;
  margin-top: 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.1);
  overflow: hidden;
}

.progress-track span {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--mint), var(--neon));
  box-shadow: 0 0 12px var(--neon);
  transition: width 0.6s var(--ease);
}

.drawer-items {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 6px 18px;
  display: grid;
  align-content: start;
  gap: 10px;
}

.line-item {
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 12px;
  padding: 10px;
  border-radius: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  animation: slide-in 0.45s var(--ease);
}

@keyframes slide-in {
  from {
    opacity: 0;
    transform: translateX(20px);
  }
}

.line-item-media {
  position: relative;
  width: 76px;
  height: 92px;
  border-radius: 12px;
  overflow: hidden;
  background: #2a1f43;
}

.line-item-media img {
  object-fit: cover;
}

.line-item-title {
  font-weight: 700;
  font-size: 15px;
  line-height: 1.25;
}

.line-item-variant {
  font-size: 13px;
  color: var(--muted);
}

.line-item-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
}

.qty {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  border: 1px solid var(--border);
}

.qty button {
  width: 34px;
  height: 34px;
  border: 0;
  background: none;
  font-size: 18px;
}

.qty span {
  min-width: 22px;
  text-align: center;
  font-weight: 700;
  font-size: 14px;
}

.drawer-empty {
  text-align: center;
  padding: 50px 10px;
  color: var(--muted);
  display: grid;
  gap: 18px;
  justify-items: center;
}

.drawer-foot {
  padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  display: grid;
  gap: 12px;
}

.drawer-total {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  font-size: 18px;
}

.drawer-note {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ---------- Product page ---------- */
.pdp {
  padding-top: calc(var(--header-h) + 22px);
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 14px;
}

.pdp-layout {
  display: grid;
  gap: 24px;
}

.gallery {
  position: relative;
  margin: 0 calc(var(--gutter) * -1);
}

.gallery-track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  gap: 10px;
  padding: 0 var(--gutter);
}

.gallery-track::-webkit-scrollbar {
  display: none;
}

.gallery-slide {
  position: relative;
  flex: 0 0 100%;
  aspect-ratio: 4 / 5;
  scroll-snap-align: center;
  border-radius: 26px;
  overflow: hidden;
  background: #241a38;
  border: 0;
  padding: 0;
  cursor: zoom-in;
}

.gallery-slide img {
  object-fit: cover;
}

.gallery-hint {
  position: absolute;
  right: calc(var(--gutter) + 12px);
  bottom: 34px;
  z-index: 2;
  pointer-events: none;
}

.gallery-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 12px;
}

.gallery-dots button {
  width: 8px;
  height: 8px;
  padding: 0;
  border-radius: 999px;
  border: 0;
  background: rgba(255, 255, 255, 0.25);
  transition: width 0.3s var(--ease), background 0.3s;
}

.gallery-dots button[aria-current="true"] {
  width: 24px;
  background: var(--neon);
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(5, 3, 10, 0.94);
  display: grid;
  place-items: center;
  overflow: hidden;
  touch-action: none;
  animation: fade 0.3s var(--ease);
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

.lightbox-stage {
  position: relative;
  width: 100%;
  height: 100%;
  cursor: zoom-in;
}

.lightbox-stage.zoomed {
  cursor: grab;
}

.lightbox-stage img {
  object-fit: contain;
  transition: transform 0.35s var(--ease);
  will-change: transform;
}

.lightbox-stage.dragging img {
  transition: none;
}

.lightbox-close {
  position: absolute;
  top: calc(14px + env(safe-area-inset-top));
  right: 14px;
  z-index: 2;
}

.lightbox-tip {
  position: absolute;
  bottom: calc(22px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  white-space: nowrap;
}

.pdp-title {
  font-size: clamp(32px, 9vw, 52px);
  font-weight: 800;
  margin: 10px 0 8px;
}

.pdp-sub {
  color: var(--muted);
  font-size: 16px;
}

.pdp-rating {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  font-size: 14px;
  color: var(--muted);
}

.pdp-price {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 18px 0;
}

.pdp-price .price {
  font-size: 30px;
}

.option-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.option-values {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 22px;
}

.pdp-desc {
  color: rgba(247, 243, 255, 0.85);
  font-size: 16px;
  margin: 22px 0;
}

.details {
  border-top: 1px solid var(--border);
}

.details details {
  border-bottom: 1px solid var(--border);
  padding: 4px 0;
}

.details summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  font-weight: 700;
  cursor: pointer;
}

.details summary::-webkit-details-marker {
  display: none;
}

.details summary::after {
  content: "+";
  font-size: 22px;
  color: var(--neon);
  transition: transform 0.3s var(--ease);
}

.details details[open] summary::after {
  transform: rotate(45deg);
}

.details details p {
  padding-bottom: 14px;
  color: var(--muted);
}

.sticky-buy {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: calc(10px + env(safe-area-inset-bottom));
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 8px 8px 18px;
  border-radius: 999px;
}

.sticky-buy .btn {
  flex: 1;
  min-height: 48px;
}

.sticky-buy-price {
  font-weight: 800;
  font-size: 18px;
  white-space: nowrap;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom));
  z-index: 90;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s var(--ease);
  max-width: calc(100vw - 32px);
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ---------- Scroll reveal ---------- */
.js [data-reveal] {
  opacity: 0;
  transform: translateY(28px) scale(0.98);
  transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
  transition-delay: var(--delay, 0ms);
}

.js [data-reveal].is-in {
  opacity: 1;
  transform: none;
}

/* ---------- Larger screens ---------- */
@media (min-width: 640px) {
  :root {
    --gutter: 24px;
  }
  .review-card {
    flex-basis: 46%;
  }
  .usp-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .footer-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (min-width: 900px) {
  .header-nav {
    display: flex;
  }
  .grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }
  .spotlight {
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 28px;
    gap: 40px;
  }
  .pdp-layout {
    grid-template-columns: 1.1fr 1fr;
    gap: 48px;
    align-items: start;
  }
  .gallery {
    margin: 0;
  }
  .gallery-track {
    padding: 0;
  }
  .pdp-info {
    position: sticky;
    top: calc(var(--header-h) + 30px);
  }
  .sticky-buy {
    display: none;
  }
  .review-card {
    flex-basis: 31%;
  }
  .review-list {
    grid-template-columns: 1fr 1fr;
  }
  .newsletter {
    padding: 56px;
  }
  .newsletter-form {
    max-width: 480px;
    margin: 24px auto 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .js [data-reveal] {
    opacity: 1;
    transform: none;
  }
}

.grid > * {
  display: flex;
}

.grid > * > .card {
  flex: 1;
}

.btn:disabled {
  opacity: 0.7;
}

.img-wrap { position: relative; }
.img-wrap > img { position: absolute; inset: 0; width: 100%; height: 100%; }
.cart-count[hidden] { display: none; }
</style>

    box.setAttribute("role", "dialog")
    box.setAttribute("aria-label", title + " Zoomansicht")
    box.innerHTML = '<button class="icon-btn lightbox-close glass" aria-label="Zoom schließen">' + ICON.close + '</button><div class="lightbox-stage zoomed img-wrap">' +
      '<img src="' + esc(src) + '" alt="' + esc(title) + '" draggable="false" data-fallback="' + esc(title) + '" style="object-fit:contain"></div>' +
      '<span class="lightbox-tip pill glass">Ziehen zum Verschieben, tippen zum Verkleinern</span>'
    document.body.appendChild(box)
    document.body.style.overflow = "hidden"
    var stage = box.querySelector(".lightbox-stage")
    var tip = box.querySelector(".lightbox-tip")
    var zoomed = true, off = { x: 0, y: 0 }, drag = null

    function clamp(p) {
      var mx = ((ZOOM - 1) * stage.clientWidth) / 2, my = ((ZOOM - 1) * stage.clientHeight) / 2
      return { x: Math.max(-mx, Math.min(mx, p.x)), y: Math.max(-my, Math.min(my, p.y)) }
    }
    function apply() {
      var im = stage.querySelector("img")
      if (im) im.style.transform = "translate3d(" + off.x + "px," + off.y + "px,0) scale(" + (zoomed ? ZOOM : 1) + ")"
      stage.classList.toggle("zoomed", zoomed)
      tip.textContent = zoomed ? "Ziehen zum Verschieben, tippen zum Verkleinern" : "Tippen zum Zoomen"
    }
    function zoomAt(x, y) {
      off = clamp({ x: (0.5 - x) * stage.clientWidth * ZOOM, y: (0.5 - y) * stage.clientHeight * ZOOM })
    }
    zoomAt(ox, oy)
    apply()

    function close() {
      box.remove()
      document.body.style.overflow = ""
      document.removeEventListener("keydown", onKey)
    }
    function onKey(e) { if (e.key === "Escape") close() }
    document.addEventListener("keydown", onKey)
    box.querySelector(".lightbox-close").onclick = close

    stage.addEventListener("pointerdown", function (e) {
      stage.setPointerCapture(e.pointerId)
      drag = { sx: e.clientX, sy: e.clientY, bx: off.x, by: off.y, moved: false }
    })
    stage.addEventListener("pointermove", function (e) {
      if (!drag || !zoomed) return
      var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy
      if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; stage.classList.add("dragging") }
      if (drag.moved) { off = clamp({ x: drag.bx + dx, y: drag.by + dy }); apply() }
    })
    stage.addEventListener("pointerup", function (e) {
      var d = drag
      drag = null
      stage.classList.remove("dragging")
      if (!d || d.moved) return
      if (zoomed) { zoomed = false; off = { x: 0, y: 0 } }
      else {
        var r = stage.getBoundingClientRect()
        zoomed = true
        zoomAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height)
      }
      apply()
    })
    stage.addEventListener("pointercancel", function () { drag = null; stage.classList.remove("dragging") })
  }

  // ---------- routing ----------
  function scrollToId(id) {
    var el = document.getElementById(id)
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: "smooth" })
  }
  function go(hash, section) {
    if (location.hash === hash || (hash === "#/" && !location.hash)) { if (section) scrollToId(section); return }
    pendingScroll = section
    location.hash = hash
  }
  var pendingScroll = null
  function route() {
    var m = location.hash.match(/^#\/p\/(.+)$/)
    var p = m && byHandle(decodeURIComponent(m[1]))
    closeCart()
    if (p) { document.title = p.title + " | Vermont"; productView(p); window.scrollTo(0, 0) }
    else {
      document.title = "Vermont | Wellness & Massage"
      view.onclick = null
      home(pendingScroll)
      if (!pendingScroll) window.scrollTo(0, 0)
    }
    pendingScroll = null
  }

  document.addEventListener("click", function (e) {
    var s = e.target.closest("[data-scroll]")
    if (s) {
      e.preventDefault()
      var onProduct = /^#\/p\//.test(location.hash)
      if (s.dataset.scroll === "bewertungen" || !onProduct) scrollToId(s.dataset.scroll)
      else go("#/", s.dataset.scroll)
      return
    }
    var c = e.target.closest("[data-cat]")
    if (c) { activeCat = c.dataset.cat; renderGrid() }
  })

  window.addEventListener("hashchange", route)
  renderCart(false)
  route()
})()

</script>
</body>
</html>
